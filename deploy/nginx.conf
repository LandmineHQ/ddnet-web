# DDNet Web 生产 nginx 示例（TLS/WSS 终止在 nginx；relay 本身只讲 HTTP/WS）
#
# 放置到 /etc/nginx/conf.d/ddnet-web.conf 或 sites-enabled/，按实际证书和路径调整：
#   - play.example.com  静态站点 + wss://play.example.com/udp/...
#   - master.landmine.top relay master API（/v1/register、/v1/serverlist）
#
# 依赖：
#   docker compose -f compose.yml up -d    # relay:127.0.0.1:8390, master:127.0.0.1:8391
#   dist/web 是 wasm/前端构建产物

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 确保 wasm 以正确 MIME 返回（部分 nginx 版本的 mime.types 可能没有）
types {
    application/wasm wasm;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.example.com;

    ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/ddnet-web;
    index index.html;

    # SharedArrayBuffer / wasm pthreads 必需
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # relay：WebSocket 游戏流量、healthz、HTTP API、WebRTC 信令
    location ~ ^/(?:udp/|ws$|healthz$|api/|rtc/) {
        proxy_pass http://127.0.0.1:8390;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # 前端默认请求同源 /relay-master/v1/serverlist；strip 前缀后转给 master
    location /relay-master/ {
        proxy_pass http://127.0.0.1:8391/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name master.landmine.top;

    ssl_certificate     /etc/letsencrypt/live/master.landmine.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/master.landmine.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8391;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }
}
