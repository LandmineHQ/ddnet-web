name: pages

# build 成功后自动发布 web-dist 到 GitHub Pages。
# 仓库设置：Settings -> Pages -> Source = GitHub Actions。
on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_id:
        description: "build workflow run id（手动重新发布时填写）"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # web-dist 含 DDNet.data（约 51.6 MB），Pages 压缩后仍约 49 MB；
    # deploy-pages 默认只等 10 分钟，sync 大文件时容易误超时。
    timeout-minutes: 40
    steps:
      - name: Download web-dist from triggering build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web-dist from manual run_id
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 默认 600000（10 分钟）对含 51.6 MB DDNet.data 的站点偏短。
          timeout: '1800000'
          error_count: '20'
          reporting_interval: '10000'
